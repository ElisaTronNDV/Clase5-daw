<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <h1 class="h3 mb-4">Iniciar sesión</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username" />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="form.invalid">Ingresar</button>
      </form>

      <p class="mt-3">¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
    </div>
  </div>
</div>
